name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build and test (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore MyShop..sln

      - name: Build
        run: dotnet build MyShop..sln --configuration Release --no-restore

      - name: Run unit and integration tests with coverage
        run: dotnet test MyShop..sln --configuration Release --no-build --no-restore --coverlet --coverlet-output-format cobertura

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: TestResults/*.cobertura.*.xml
          if-no-files-found: warn
          retention-days: 14
